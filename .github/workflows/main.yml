
name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Enable this after configuring a test script
      # in package.json.
      # - name: Run tests
      #   run: npm test

      - name: Build Docker image
        run: docker build -t my-node-app:${{ github.sha }} .
