name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/server/package-lock.json

      - name: Install dependencies
        working-directory: code/server
        run: npm ci

      - name: Build Docker image
        working-directory: code/server
        run: docker build -t grocery-server:test .

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./code/server
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    runs-on: [self-hosted, Linux, X64]
    name: Deploy to WSL Ubuntu
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cicd-vm]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Pull Docker image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker pull "$IMAGE:$GITHUB_SHA"

      - name: Deploy container
        shell: bash
        run: |
          set -e

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          # Remove the previous container if one exists.
          docker rm -f grocery-server 2>/dev/null || true

          # Start the new application container.
          docker run -d \
            --name grocery-server \
            --restart unless-stopped \
            -p 8081:8081 \
            "$IMAGE:$GITHUB_SHA"

          # Allow the application time to start.
          sleep 5

          # Fail the deployment if the container has stopped.
          if [ "$(docker inspect -f '{{.State.Running}}' grocery-server)" != "true" ]; then
            docker logs grocery-server
            exit 1
          fi

          echo "Container is running."
          docker ps --filter name=grocery-server
          docker logs --tail 50 grocery-server